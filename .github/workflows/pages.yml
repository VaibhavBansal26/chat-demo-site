name: deploy-pages
# Deploys on every push to main and on demand. One-time setup: Settings > Pages > Source: GitHub Actions.
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   CONVERSATIONS_URL  the address of your Conversations app (default is already set in config.js)
#   WIDGET_TOKEN       the embed token created for this site's domain (public by design, locked to that domain)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: npm run build
        env:
          CONVERSATIONS_URL: ${{ vars.CONVERSATIONS_URL }}
          WIDGET_TOKEN: ${{ vars.WIDGET_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
